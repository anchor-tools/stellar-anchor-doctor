name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency review
        uses: actions/dependency-review-action@v4

  test:
    name: Build & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run test suite
        run: npm run test

      - name: Build binary / package
        run: npm run build

      - name: CLI smoke test
        run: |
          node ./bin/stellar-anchor-doctor.js --version
          checks="$(NO_COLOR=1 node ./bin/stellar-anchor-doctor.js list-checks)"
          for check in sep-1 sep-10 sep-24 sep-38 sep-6 security; do
            if ! echo "$checks" | grep -Eq "^[[:space:]]*${check}[[:space:]]"; then
              echo "::error::Missing diagnostic check: $check"
              exit 1
            fi
          done
